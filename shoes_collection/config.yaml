name: Shoes Collection
version: "1.6.2"
slug: shoes_collection
url: https://github.com/pcmansf/shoes
description: Your shoe collection, photos, locations, and Stored / Taken out status.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 60
backup: cold
ports:
  8099/tcp: 8099
webui: "http://[HOST]:[PORT:8099]"
watchdog: "tcp://[HOST]:[PORT:8099]"
options:
  require_login: true
  username: shoes
  origins:
    - "http://homeassistant.local:8099"
schema:
  require_login: bool
  username: str(1,)
  password: password?
  origins:
    - str
  google_client_id: str?
  google_api_key: str?
  google_app_id: str?
